name: Update static market data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

jobs:
  update-static-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore market-data cache
        uses: actions/cache@v4
        with:
          path: cache
          key: market-data-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-data-cache-${{ runner.os }}-

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Run JavaScript tests
        run: npm run test:js

      - name: Export static dataset
        run: python scripts/export_static_market_data.py --start 1994-07-01

      - name: Validate Python and JavaScript equivalence
        run: python scripts/validate_static_reference_cases.py

      - name: Commit updated dataset
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update static market data"
          file_pattern: public/data/market-data.latest.json public/data/market-data.manifest.json
